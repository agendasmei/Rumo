<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumo</title>
<style>
  :root{
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --page-bg-1: #cfe6f2; --page-bg-2: #b9d6e6;
    --cream: #14171f; --muted: #7c8592;
    --gold: #FFB020; --blue: #2F6FED;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: linear-gradient(160deg, var(--page-bg-1), var(--page-bg-2));
    color: var(--cream); font-family: var(--font); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
    -webkit-font-smoothing: antialiased;
  }
  .card{ background:#fff; border-radius:24px; padding:40px 36px; width:400px; max-width:100%; box-shadow:0 30px 60px rgba(10,40,70,.22); text-align:center; }
  .logo-mark{ width:44px; height:44px; border-radius:50%; margin:0 auto 16px; background: conic-gradient(from 210deg, #2F6FED, #79d4ff, #2F6FED); box-shadow: 0 3px 10px rgba(47,111,237,.45); }
  h1{ font-size:21px; margin:0 0 6px; font-weight:800; letter-spacing:-.01em; }
  .sub{ font-size:13px; color:var(--muted); margin-bottom:26px; }
  .opt{ display:flex; flex-direction:column; gap:10px; }
  a.btn{ display:block; text-decoration:none; font-family:var(--font); font-weight:700; font-size:14px; padding:14px; border-radius:14px; transition:filter .15s, transform .1s; }
  a.btn:active{ transform: scale(.985); }
  a.btn.gold{ background:var(--gold); color:#fff; }
  a.btn.blue{ background:var(--blue); color:#fff; }
  a.btn:hover{ filter:brightness(1.06); }
  a.btn .lbl2{ display:block; font-weight:500; font-size:11.5px; opacity:.85; margin-top:2px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-mark"></div>
    <h1>Rumo</h1>
    <div class="sub">O jeito mais simples de cuidar do dinheiro.</div>
    <div class="opt">
      <a class="btn blue" href="./central.html">Sou a consultora<span class="lbl2">Acessar o Central</span></a>
      <a class="btn gold" href="./cliente.html">Sou cliente<span class="lbl2">Acessar meu painel</span></a>
    </div>
  </div>
</body>
</html>
