<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Painel</title>
<style>
  :root{
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
    --page-bg-1: #cfe6f2; --page-bg-2: #b9d6e6; --shell-bg: #eef2f6;
    --panel: #ffffff; --line: rgba(20,30,40,.08); --cream: #14171f; --muted: #7c8592; --muted-2: #a2aab4;
    --gold: #FFB020; --gold-dim: rgba(255,176,32,.16); --green: #34C77A; --green-dim: rgba(52,199,122,.16);
    --blue: #2F6FED; --blue-dim: rgba(47,111,237,.14); --red: #FF6FA0; --red-dim: rgba(255,111,160,.16);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--shell-bg); color: var(--cream); font-family: var(--font); min-height:100vh; -webkit-font-smoothing: antialiased; }
  .wrap{ max-width:760px; margin:0 auto; padding:26px 20px 60px; }
  .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .top h1{ font-size:21px; font-weight:800; margin:0; letter-spacing:-.01em; }
  .top .sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .logout-btn{ background:var(--panel); border:1px solid var(--line); color:var(--muted); font-family:var(--font); font-weight:600; font-size:12.5px; padding:8px 14px; border-radius:980px; cursor:pointer; }
  .logout-btn:hover{ background:var(--bg-alt,#eef2f6); color:var(--cream); }
  .panel{ background: var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.04); margin-bottom:18px; }
  .panel h2{ font-size:15px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em; }
  .panel .sub{ font-size:12.5px; color:var(--muted); margin:0 0 16px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:13px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:15px 16px 14px; }
  .card .lbl{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .card .val{ font-family: var(--font-mono); font-size:19px; font-weight:600; margin-top:6px; letter-spacing:-.01em; overflow-wrap:break-word; }
  .card.gold .val{ color:var(--gold); } .card.green .val{ color:var(--green); } .card.blue .val{ color:var(--blue); }
  .card .subtxt{ font-size:11px; color:var(--muted-2); margin-top:4px; }
  table{ width:100%; border-collapse:collapse; font-family: var(--font-mono); font-size:12px; }
  thead th{ text-align:right; padding:8px 9px; color:var(--muted); border-bottom:1px solid var(--line); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; }
  thead th:first-child, tbody td:first-child{ text-align:left; }
  tbody td{ text-align:right; padding:7px 9px; border-bottom:1px solid rgba(0,0,0,.04); }
  .tbl-wrap{ overflow-x:auto; }
  .empty-mini{ font-size:12.5px; color:var(--muted-2); font-style:italic; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--muted); }
  .obj-row{ padding:12px 0; border-bottom:1px solid var(--line); }
  .obj-row:last-child{ border-bottom:none; }
  .obj-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .obj-nome{ font-weight:700; font-size:13.5px; }
  .obj-meta{ font-size:11.5px; color:var(--muted-2); font-family:var(--font-mono); margin-top:2px; }
  .status-tag{ display:inline-block; padding:3px 9px; border-radius:8px; font-size:11px; font-weight:700; margin-top:6px; }
  .status-tag.ok{ background: var(--green-dim); color:var(--green); }
  .status-tag.warn{ background: var(--gold-dim); color:#8a6a1f; }
  .orc-cat-card{ background:#fff; border:1px solid var(--line); border-radius:16px; margin-bottom:12px; overflow:hidden; }
  .orc-cat-card.over{ border-color: var(--red); }
  .orc-cat-header{ display:flex; justify-content:space-between; align-items:center; padding:13px 16px; flex-wrap:wrap; gap:8px; }
  .orc-cat-header.over-bg{ background: var(--red-dim); }
  .orc-cat-name{ font-size:14px; font-weight:700; }
  .orc-cat-name.over{ color:var(--red); }
  .orc-cat-nums{ font-family: var(--font-mono); font-size:14px; }
  .orc-cat-gasto.over{ color:var(--red); font-weight:700; }
  .orc-cat-gasto.normal{ font-weight:700; }
  .orc-cat-teto{ color:var(--muted); }
  .orc-bar-track{ height:6px; background:var(--shell-bg); margin:0 16px; border-radius:3px; overflow:hidden; }
  .orc-bar-fill{ height:100%; }
  .orc-cat-body{ padding:10px 16px 14px; font-size:11.5px; color:var(--muted); }
  .orc-gasto-item{ display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px dashed var(--line); }
  .orc-gasto-item:last-child{ border-bottom:none; }
  .obs-item{ font-size:13px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .obs-item:last-child{ border-bottom:none; }
  .passo-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .passo-item:last-child{ border-bottom:none; }
  .passo-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .passo-dot.done{ background:var(--green); }
  .passo-dot.pend{ background:var(--gold); }
  .passo-done-text{ text-decoration:line-through; color:var(--muted); }
  .fluxo-mes-row{ display:grid; grid-template-columns:60px 1fr 100px; gap:10px; align-items:center; padding:6px 0; }
  .fluxo-bar-wrap{ background:var(--shell-bg); border-radius:6px; height:8px; overflow:hidden; }
  .fluxo-bar{ background:var(--blue); height:100%; border-radius:6px; }
  /* Auth */
  .auth-screen{ position:fixed; inset:0; background: linear-gradient(160deg, var(--page-bg-1), var(--page-bg-2)); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
  .auth-card{ background:#fff; border-radius:24px; padding:36px 32px; width:360px; max-width:100%; box-shadow:0 30px 60px rgba(10,40,70,.22); text-align:center; }
  .auth-card h2{ font-size:20px; margin:4px 0 4px; font-weight:700; }
  .auth-sub{ font-size:12.5px; color:var(--muted); margin-bottom:18px; }
  .auth-tabs{ display:inline-flex; gap:2px; padding:3px; background:var(--shell-bg); border-radius:12px; margin-bottom:18px; }
  .auth-tab-btn{ background:none; border:none; padding:8px 18px; border-radius:9px; font-family:var(--font); font-weight:600; font-size:13px; color:var(--muted); cursor:pointer; }
  .auth-tab-btn.active{ background:#fff; color:var(--cream); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .auth-pane{ display:none; text-align:left; }
  .auth-pane.active{ display:block; }
  label{ display:block; font-size:12.5px; color:var(--muted); margin:14px 0 6px; font-weight:500; text-align:left; }
  input[type=email], input[type=password]{ width:100%; background:var(--shell-bg); border:1px solid transparent; color:var(--cream); font-family: var(--font); font-size:14px; padding:10px 12px; border-radius:10px; outline:none; }
  input:focus{ border-color: var(--gold); background:#fff; }
  .pill-btn{ background:var(--gold); color:#fff; border:none; font-family:var(--font); font-weight:600; font-size:13.5px; padding:11px 18px; border-radius:980px; cursor:pointer; width:100%; margin-top:16px; }
  .pill-btn:hover{ filter:brightness(1.06); }
  .auth-msg{ font-size:12.5px; margin-top:10px; color:var(--red); min-height:16px; text-align:left; }
  .auth-msg.ok{ color:var(--green); }
  .loading-box{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px; }
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h2>Meu Painel</h2>
    <div class="auth-sub">Acompanhe o que sua consultora compartilhou com você.</div>
    <div class="auth-tabs">
      <button class="auth-tab-btn active" data-authtab="login" onclick="switchAuthTab('login')">Entrar</button>
      <button class="auth-tab-btn" data-authtab="signup" onclick="switchAuthTab('signup')">Criar conta</button>
    </div>
    <div class="auth-pane active" id="authPaneLogin">
      <label>Email</label>
      <input type="email" id="login_email" placeholder="voce@email.com" onkeydown="if(event.key==='Enter')fazerLogin()">
      <label>Senha</label>
      <input type="password" id="login_senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')fazerLogin()">
      <button class="pill-btn" onclick="fazerLogin()">Entrar</button>
      <div class="auth-msg" id="loginMsg"></div>
    </div>
    <div class="auth-pane" id="authPaneSignup">
      <label>Email</label>
      <input type="email" id="signup_email" placeholder="use o email que sua consultora cadastrou" onkeydown="if(event.key==='Enter')fazerCadastro()">
      <label>Senha (mín. 6 caracteres)</label>
      <input type="password" id="signup_senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')fazerCadastro()">
      <button class="pill-btn" onclick="fazerCadastro()">Criar conta</button>
      <div class="auth-msg" id="signupMsg"></div>
    </div>
  </div>
</div>
<div id="appShell" style="display:none">
  <div class="wrap">
    <div class="top">
      <div>
        <h1 id="topNome">Meu Painel</h1>
        <div class="sub" id="topEmail"></div>
      </div>
      <button class="logout-btn" onclick="fazerLogout()">Sair</button>
    </div>
    <div id="conteudo"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://dfvyvampiraveeanbygs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tD43VHqTAW_YLb0SoXu3Jg_aEIIZP7p';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const fmt = v => (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:2});

function switchAuthTab(tab){
  document.querySelectorAll('.auth-tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.authtab===tab));
  $('authPaneLogin').classList.toggle('active', tab==='login');
  $('authPaneSignup').classList.toggle('active', tab==='signup');
}
async function fazerCadastro(){
  const email = $('signup_email').value.trim();
  const senha = $('signup_senha').value;
  if(!email || senha.length < 6){ $('signupMsg').textContent = 'Preencha email e uma senha com pelo menos 6 caracteres.'; $('signupMsg').className='auth-msg'; return; }
  $('signupMsg').textContent = 'Criando conta...';
  $('signupMsg').className = 'auth-msg';
  const { data, error } = await sb.auth.signUp({ email, password: senha });
  if(error){ $('signupMsg').textContent = 'Erro: ' + error.message; return; }
  if(data.session){ onAuthReady(data.session.user); }
  else { $('signupMsg').textContent = 'Conta criada! Verifique seu email pra confirmar antes de entrar.'; $('signupMsg').className = 'auth-msg ok'; }
}
async function fazerLogin(){
  const email = $('login_email').value.trim();
  const senha = $('login_senha').value;
  if(!email || !senha){ $('loginMsg').textContent = 'Preencha email e senha.'; return; }
  $('loginMsg').textContent = 'Entrando...';
  $('loginMsg').className = 'auth-msg';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ $('loginMsg').textContent = 'Erro: ' + error.message; return; }
  onAuthReady(data.user);
}
async function fazerLogout(){
  await sb.auth.signOut();
  location.reload();
}
async function onAuthReady(user){
  $('authScreen').style.display = 'none';
  $('appShell').style.display = 'block';
  $('topEmail').textContent = user.email;
  $('conteudo').innerHTML = '<div class="loading-box">Carregando...</div>';
  const { data, error } = await sb.from('client_views').select('*').order('updated_at', { ascending:false });
  if(error){
    $('conteudo').innerHTML = '<div class="panel"><div class="empty-state">Não foi possível carregar seus dados agora. Tente de novo em instantes.</div></div>';
    return;
  }
  if(!data || data.length === 0){
    $('conteudo').innerHTML = '<div class="panel"><div class="empty-state">Ainda não há nada compartilhado com esse email. Confirme com sua consultora se é este mesmo o email cadastrado.</div></div>';
    return;
  }
  renderPainel(data[0]);
}
function renderPainel(view){
  const snap = view.snapshot || {};
  $('topNome').textContent = snap.nome ? ('Painel de ' + snap.nome) : 'Meu Painel';
  let html = '';
  if(snap.objetivos) html += renderObjetivos(snap.objetivos);
  if(snap.investimentos) html += renderInvestimentos(snap.investimentos);
  if(snap.carteira) html += renderCarteira(snap.carteira);
  if(snap.orcamento) html += renderOrcamento(snap.orcamento);
  if(snap.fluxo) html += renderFluxo(snap.fluxo);
  if(snap.passos) html += renderPassos(snap.passos);
  $('conteudo').innerHTML = html || '<div class="panel"><div class="empty-state">Sua consultora ainda não liberou nenhuma seção pra você ver por aqui.</div></div>';
}
function renderObjetivos(objetivos){
  if(!objetivos.length) return '';
  const linhas = objetivos.map(o => `
    <div class="obj-row">
      <div class="obj-top"><span class="obj-nome">${o.nome}</span><span class="obj-meta">${fmt(o.alocado)} / ${fmt(o.meta)}</span></div>
      <div class="obj-meta">${o.dataAlvo ? ('meta pra ' + new Date(o.dataAlvo+'T00:00:00').toLocaleDateString('pt-BR')) : ''}${o.mesesRestantes>0 ? (' · ' + o.mesesRestantes + ' meses restantes · precisa guardar ' + fmt(o.necessario) + '/mês') : ''}</div>
      <span class="status-tag ${o.statusType}">${o.statusLabel}</span>
    </div>`).join('');
  return `<div class="panel"><h2>Objetivos</h2><p class="sub">Suas metas e o quanto já foi alocado pra cada uma.</p>${linhas}</div>`;
}
function renderInvestimentos(inv){
  if(!inv.itens || !inv.itens.length) return '';
  const linhas = inv.itens.map(i => `<tr><td>${i.nome}</td><td>${i.tipo}</td><td>${fmt(i.valor)}</td></tr>`).join('');
  return `<div class="panel"><h2>Investimentos</h2><p class="sub">Seus ativos registrados.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Ativo</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>${linhas}</tbody></table></div>
    <div class="cards" style="margin-top:16px"><div class="card gold"><div class="lbl">Total investido</div><div class="val">${fmt(inv.total)}</div></div></div>
  </div>`;
}
function renderCarteira(cenarios){
  if(!cenarios.length) return '';
  const cards = cenarios.map(s => `
    <div class="card blue">
      <div class="lbl">${s.nome}</div>
      <div class="val">${fmt(s.patrimonioFinal)}</div>
      <div class="subtxt">aportado: ${fmt(s.aportadoFinal)} · rendimento: ${s.rendimento>=0?'+':''}${fmt(s.rendimento)}</div>
    </div>`).join('');
  return `<div class="panel"><h2>Carteira</h2><p class="sub">Projeções salvas pela sua consultora.</p><div class="cards">${cards}</div></div>`;
}
function renderOrcamento(orc){
  if(!orc.categorias || !orc.categorias.length){
    return `<div class="panel"><h2>Orçamento Familiar</h2><p class="sub">Nenhuma categoria cadastrada ainda.</p></div>`;
  }
  const cats = orc.categorias.map(cat => {
    const gasto = (cat.gastos||[]).reduce((s,g)=>s+g.valor,0);
    const pct = cat.teto>0 ? (gasto/cat.teto*100) : 0;
    const over = gasto > cat.teto && cat.teto>0;
    const barPct = Math.min(pct,100);
    const barColor = over ? 'var(--red)' : (pct>=80 ? 'var(--gold)' : 'var(--blue)');
    const gastosHtml = (cat.gastos||[]).length ? cat.gastos.map(g=>`<div class="orc-gasto-item"><span>${g.desc} <span style="color:var(--muted-2)">${g.data}</span></span><span>${fmt(g.valor)}</span></div>`).join('') : '<div class="empty-mini">Nenhum gasto lançado.</div>';
    return `<div class="orc-cat-card ${over?'over':''}">
      <div class="orc-cat-header ${over?'over-bg':''}">
        <span class="orc-cat-name ${over?'over':''}">${cat.nome}</span>
        <span class="orc-cat-nums"><span class="orc-cat-gasto ${over?'over':'normal'}">${fmt(gasto)}</span> / <span class="orc-cat-teto">${fmt(cat.teto)}</span></span>
      </div>
      <div class="orc-bar-track"><div class="orc-bar-fill" style="width:${barPct}%;background:${barColor}"></div></div>
      <div class="orc-cat-body">${gastosHtml}</div>
    </div>`;
  }).join('');
  const obs = (orc.observacoes||[]).length ? orc.observacoes.map(o=>`<div class="obs-item">• ${o.texto}</div>`).join('') : '<div class="empty-mini">Nenhuma observação.</div>';
  return `<div class="panel"><h2>Orçamento Familiar</h2><p class="sub">Categorias, teto e gastos lançados.</p>${cats}
    <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line)"><div class="sub" style="margin-bottom:8px">Observações</div>${obs}</div>
  </div>`;
}
function renderFluxo(fluxoMeses){
  if(!fluxoMeses.length) return '';
  const parseM = v => parseFloat(String(v||'0').replace(/\./g,'').replace(',', '.')) || 0;
  const linhas = fluxoMeses.map((m,idx) => {
    const ganha = parseM(m.ganha), gasta = parseM(m.gasta);
    const sobra = ganha - gasta;
    return { label:'Mês '+(idx+1), sobra };
  });
  const max = Math.max(...linhas.map(l=>Math.abs(l.sobra)), 1);
  const rows = linhas.map(l => `
    <div class="fluxo-mes-row">
      <div>${l.label}</div>
      <div class="fluxo-bar-wrap"><div class="fluxo-bar" style="width:${Math.max(Math.abs(l.sobra)/max*100,2)}%"></div></div>
      <div style="text-align:right; font-family:var(--font-mono); font-size:12px">${fmt(l.sobra)}</div>
    </div>`).join('');
  return `<div class="panel"><h2>Fluxo Mensal</h2><p class="sub">Sobra de cada mês (ganhos − gastos).</p>${rows}</div>`;
}
function renderPassos(passos){
  if(!passos.length) return `<div class="panel"><h2>Próximos passos</h2><p class="sub">Nenhuma tarefa pendente pra você no momento.</p></div>`;
  const linhas = passos.map(p => `
    <div class="passo-item">
      <span class="passo-dot ${p.done?'done':'pend'}"></span>
      <span class="${p.done?'passo-done-text':''}">${p.texto}${p.prazo?(' — ' + new Date(p.prazo+'T00:00:00').toLocaleDateString('pt-BR')):''}</span>
    </div>`).join('');
  return `<div class="panel"><h2>Próximos passos</h2><p class="sub">O que ficou combinado com você.</p>${linhas}</div>`;
}
(async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(session) onAuthReady(session.user);
})();
</script>
</body>
</html>
